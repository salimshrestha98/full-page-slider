name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        tools: composer:v2
        coverage: none
    
    - name: Validate composer.json
      run: composer validate --strict || true
    
    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress --no-dev || true
    
    - name: PHP Lint
      run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        tools: composer:v2, phpcs
        coverage: none
    
    - name: Install PHPCS and WordPress Coding Standards
      run: |
        composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
        composer global require "squizlabs/php_codesniffer:^3.9" "wp-coding-standards/wpcs:^3.2" --with-all-dependencies
        phpcs --config-set installed_paths $HOME/.composer/vendor/wp-coding-standards/wpcs
    
    - name: Run PHPCS
      run: phpcs --standard=WordPress --extensions=php --ignore=vendor/ . || true

  javascript-lint:
    name: JavaScript Lint & Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: npm install
    
    - name: Run ESLint
      run: npx eslint src/ --ext .js || true
    
    - name: Run Stylelint
      run: npx stylelint "src/**/*.scss" "src/**/*.css" || true
    
    - name: Build assets
      run: npm run build || grunt build || grunt default 